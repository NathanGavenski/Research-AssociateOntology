[project]
name = "aiact-onto"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "ollama>=0.6",
  "owlready2>=0.46",
  "pandas>=2.2",
  "pydantic>=2.6",
  "pylode>=3.0",
  "pyshacl>=0.26",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rapidfuzz>=3.6",
  "rdflib>=7.0",
  "requests>=2.31",
  "rich>=13.7",
  "tenacity>=8.2",
  "tqdm>=4.66",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pre-commit>=3.6", "pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiact_onto", "schemas"]
